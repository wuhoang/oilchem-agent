# Alembic configuration for OilChem Agent
#
# This file is used by the `alembic` command-line tool.
# See https://alembic.sqlalchemy.org/ for documentation.

[alembic]
# Migration scripts directory
script_location = alembic

# Logging
log_level = WARN
log_file =

# SQLAlchemy connection URL (resolved dynamically in env.py)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARN
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
